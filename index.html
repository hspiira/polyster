<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Tailor & Rental Tracker</title>
    <meta name="description" content="Offline-first order, measurement, and payment tracker for cloth tailoring and rental shops." />

    <!-- Standard PWA icon, used by Chromium browsers via the manifest -->
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />

    <!--
      iOS Safari ignores the web manifest for install branding (icon + name).
      These two tags are what iOS actually reads instead.
      See ARCHITECTURE.md section 1 / pwa-research-notes.md section 1.
    -->
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="apple-mobile-web-app-title" content="Tailor Tracker" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <meta name="theme-color" content="#111827" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
