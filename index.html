<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Polyster</title>
    <meta name="description" content="Offline-first order, measurement, and payment tracker for cloth tailoring and rental shops." />

    <!-- Standard PWA icon, used by Chromium browsers via the manifest -->
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />

    <!--
      iOS Safari ignores the web manifest for install branding (icon + name).
      These two tags are what iOS actually reads instead.
      See ARCHITECTURE.md section 1 / pwa-research-notes.md section 1.
    -->
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="apple-mobile-web-app-title" content="Polyster" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!--
      black-translucent, not default. `default` gives an installed app an opaque
      status bar and starts the web view underneath it, so the page can never
      reach the top of the screen and safe-area-inset-top reads 0. Translucent
      hands the whole screen over and reports the island as an inset, which is
      what `safe-top` then pads content clear of.

      The cost: iOS draws status bar content white with this set, so whatever
      is behind it has to be dark. The entry flow is pinned dark already; the
      shell paints StatusBarBleed behind the inset for the same reason, because
      bg-page is light in light mode and white on light cannot be read.
    -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!--
      Starting value only. src/lib/theme.ts overwrites the content with
      `--meta-theme-color` from the resolved theme as soon as the bundle runs;
      this is what the OS reads in the gap before that, and what a splash screen
      gets. Matches theme.css's dark `--meta-theme-color`, since the entry flow
      the splash leads into is a dark world either way.
    -->
    <meta name="theme-color" content="#0d0c12" />

    <script>
      /**
       * Theme, before the first paint. A deliberate copy of `resolve()` in
       * src/lib/theme.ts -- that file cannot run until the bundle loads, by
       * which point the browser has already painted the wrong theme.
       */
      (function () {
        try {
          var stored = localStorage.getItem('polyster.theme')
          var resolved =
            stored === 'light' || stored === 'dark'
              ? stored
              : matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          document.documentElement.dataset.theme = resolved
        } catch (_) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
